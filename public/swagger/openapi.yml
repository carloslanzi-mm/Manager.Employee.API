info:
  title: template-serverless-service-python
  version: 1.0.2
openapi: 3.0.2
components:
  schemas:
    Entry:
      type: object
      properties:
        status:
          type: string
          example: healthy
        duration:
          type: string
          example: '0:00:00.013737'
        tags:
          type: array
          items:
            type: string
            example: db
    EntryData:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Entry'
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          example: healthy
        total_duration:
          type: string
          example: '0:00:00.013737'
        entries:
          $ref: '#/components/schemas/EntryData'
    Meta:
      type: object
      properties:
        href:
          type: string
          format: url
        next:
          type: string
          format: url
        previous:
          type: string
          format: url
        first:
          type: string
          format: url
        last:
          type: string
          format: url
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        sku:
          type: integer
          example: 657705
        name:
          type: string
          example: "Guarda Roupa Casal com Espelho 3 Portas de Correr Lara Espresso\
            \ M\xF3veis"
        description:
          type: string
          example: "Guarda Roupa com maior resist\xEAncia, durabilidade e acabamento,\
            \ revestimento interno e externo. Pintura em estufas modernas com UV (ultra\
            \ violeta). Modelo com corredi\xE7a met\xE1lica em a\xE7o, 4 gavetas espa\xE7\
            osas, perfil em alum\xEDnio, roldanas de a\xE7o carbono com rolamento,\
            \ divis\xE3o ele/ela"
        supplier_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
        active:
          type: integer
          enum:
          - 0
          - 1
        uuid:
          type: string
          format: uuid
          example: 4bcad46b-6978-488f-8153-1c49f8a45244
    RequestControl:
      type: object
      properties:
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        count:
          type: integer
      required:
      - limit
    HateosProductListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        code:
          type: integer
          example: 1
        label:
          type: string
          example: common.success
        message:
          type: string
          example: Success
        params:
          type: array
          items:
            type: string
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        control:
          $ref: '#/components/schemas/RequestControl'
      required:
      - code
    ProductListErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
          example: 11
        label:
          type: string
          example: common.error.list_error
        message:
          type: string
          example: Unable to return the list data, please review your request
        params:
          type: array
          items:
            type: string
        details:
          type: string
        trace:
          type: string
      required:
      - code
    Link:
      type: object
      properties:
        href:
          type: string
        rel:
          type: string
        method:
          type: string
    HateosProductGetResponse:
